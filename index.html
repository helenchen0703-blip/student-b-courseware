body{background:var(--bg);color:var(--ink);font:18px/1.6 -apple-system,"PingFang SC",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 20px}

a.card .tag{display:inline-block;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;margin-bottom:10px}
a.card h2{font-size:22px;margin-bottom:4px}
a.card .date{color:var(--muted);font-size:15px}
a.card p{color:var(--muted);font-size:15px;margin-top:8px}
</style>
</head>
